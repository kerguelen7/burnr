[package]
name = "burnr"
version = "0.1.0"
edition = "2024"
description = "A lightweight libburn GUI for optical discs (runtime-loaded, not compiled in)"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
# Alleen voor het decoderen van het ingebedde venstericoon (assets/icon.png).
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"