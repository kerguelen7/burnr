[package]
name = "libburn_gui"
version = "0.1.0"
edition = "2024"
description = "Moderne egui-interface rond de systeem-libburn (runtime geladen, niet meegecompileerd)"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"